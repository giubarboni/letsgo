<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea"><!-- barra di stato del telefono: colore della pagina -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icone/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icone/letsgo-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LetsGo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><!-- come app sulla Home: la pagina va sotto la barra di stato -->
<title>Voli — LetsGo</title>
<link rel="stylesheet" href="stile.css">
<style>
  /* Biglietto: parte alta con compagnia, data, tratta; sotto, dopo la linea tratteggiata con le due tacche, bagagli, prezzo e bottoni. */
  .ticket { --cy: 70%; position: relative; margin: 0 0 16px; border-radius: 18px; background: var(--card-ticket);
    -webkit-mask: radial-gradient(circle 11px at 0 var(--cy), #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 11px at 100% var(--cy), #0000 98%, #000) right / 51% 100% no-repeat;
    mask: radial-gradient(circle 11px at 0 var(--cy), #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 11px at 100% var(--cy), #0000 98%, #000) right / 51% 100% no-repeat; }
  .t-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px 0; }
  .t-air { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .t-air img { display: block; height: 28px; }
  .t-date { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 16px; font-weight: 700; }
  .t-route { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 18px 18px 20px; }
  .t-end:last-child { text-align: right; }
  .t-time { font-size: 28px; font-weight: 700; line-height: 1.1; }
  .t-city { color: var(--muted); font-size: 14px; font-weight: 600; }
  .t-mid { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .t-mid i { flex: 1; border-top: 2px solid currentColor; opacity: .35; }
  .t-mid svg { transform: rotate(90deg); }
  .t-stub { position: relative; padding: 16px 18px; }
  .t-stub::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: 2px dashed var(--line); }
  .t-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .t-bag { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 15px; font-weight: 600; }
  .t-bag button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; }
  .t-stub .btn { padding: 9px 12px; font-size: 13px; }
  .t-price { font-size: 18px; font-weight: 700; }
</style>
</head>
<body data-page="voli">
<main class="page" id="root"></main>
<script src="nav.js"></script>
<script>
// Logo per codice della compagnia (le prime due lettere del numero volo); senza logo, il segnaposto.
const LOGHI = { FR: 'loghi/ryanair.svg' };
const STATO = { 'Prenotato': 'ok' };
function biglietto([, data, da, a, numero, oraP, oraA, stato, prezzo, linkCarta, linkInfo, bagagli, infoBagagli]) {
  const t = el('section', 'ticket'), logo = LOGHI[numero.slice(0, 2)] || 'loghi/placeholder.svg', bag = bagagli !== '' || infoBagagli;
  t.innerHTML = `
    <div class="t-top"><div class="t-air"><img src="${logo}" alt=""><span>${numero || 'Volo'}</span></div><div class="t-date">${GIORNO(data)}<span class="stato ${STATO[stato] || ''}">${stato}</span></div></div>
    <div class="t-route">
      <div class="t-end"><div class="t-time">${oraP || '--:--'}</div><div class="t-city">${da}</div></div>
      <div class="t-mid"><i></i>${iconaSvg(ICONE.voli[0], 22)}<i></i></div>
      <div class="t-end"><div class="t-time">${oraA || '--:--'}</div><div class="t-city">${a}</div></div>
    </div>
    <div class="t-stub"><div class="t-row">
      <div class="t-bag">${bag ? `${iconaSvg(ICONE.valigia[0])}${bagagli !== '' ? `<span>×${bagagli}</span>` : ''}${infoBagagli ? `<button type="button" aria-label="Bagagli ammessi">${iconaSvg(INFO)}</button>` : ''}` : ''}</div>
      <div class="t-price">${EURO(prezzo)}</div></div><div class="actions"></div></div>`;
  if (infoBagagli) t.querySelector('.t-bag button').onclick = () => modale('Bagagli ammessi', (() => { const ul = el('ul'); infoBagagli.split('\n').forEach(x => ul.append(el('li', '', x))); return ul; })());
  bottoni(t.querySelector('.actions'), [["Carta d'imbarco", linkCarta], ['Maggiori informazioni', linkInfo]]);
  return t;
}
// la tacca sta sulla linea tratteggiata, all'inizio della parte bassa: si ricalcola se cambia la larghezza
const tacche = () => document.querySelectorAll('.ticket').forEach(t => t.style.setProperty('--cy', t.querySelector('.t-stub').offsetTop + 'px'));
pagina(d => {
  d.voli.forEach(v => root.append(biglietto(v)));
  tacche(); addEventListener('resize', tacche);
});
</script>
</body>
</html>
