<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!-- la mappa va sotto la barra di stato del telefono -->
<meta name="theme-color" content="#eadfc6">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><!-- come app sulla Home: la pagina va sotto la barra di stato -->

<title>LetsGo</title>
<link rel="stylesheet" href="stile.css">
<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  h1 { font-size: 32px; margin: 0; }
  /* Mobile: il titolo sta sulla mappa, nella stessa posizione di quello delle altre pagine */
  .mtitle { display: none; position: fixed; z-index: 4; top: calc(env(safe-area-inset-top) + 16px); left: 16px; pointer-events: none; }
  .zoom { position: fixed; inset: 0; overflow: clip; background: var(--sea); touch-action: none; cursor: grab; }
  .zstage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .zstage svg { display: block; max-width: none; }
  /* Desktop: colonna a sinistra con elenco tappe e, sotto, la legenda (la navbar sta a destra). */
  .side { position: fixed; z-index: 5; top: 50%; left: 16px; transform: translateY(-50%); width: 360px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; gap: 8px; }
  .legend { flex: none; display: flex; flex-wrap: nowrap; justify-content: center; gap: 14px; padding: 6px 14px; border-radius: 8px; background: color-mix(in srgb, var(--ink) 5%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--ink); font-size: 13px; white-space: nowrap; pointer-events: none; }
  .legend svg { width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
  .panel { min-height: 0; display: flex; flex-direction: column; border-radius: 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(60, 45, 20, .18); }
  .phead { flex: none; padding: 16px 16px 4px; }
  .grab { display: none; width: 36px; height: 4px; margin: 0 auto 12px; border-radius: 2px; background: var(--muted); opacity: .5; }
  .plist { overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 8px; }
  /* Mobile: bottom sheet; la legenda sta poco sopra il pannello chiuso. */
  @media (max-width: 700px) {
    .side { display: contents; }
    .panel { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; height: calc(100vh - env(safe-area-inset-top) - 8px); height: calc(100dvh - env(safe-area-inset-top) - 8px); border-radius: 16px 16px 0 0; transform: translateY(var(--y, 60%)); transition: transform .25s ease; }
    .panel.drag { transition: none; }
    .phead { padding: 12px 16px; touch-action: none; cursor: grab; }
    .panel h1 { display: none; }
    .mtitle { display: block; }
    .grab { display: block; margin: 0 auto; }
    .plist { padding-bottom: calc(var(--nav) + 8px); } /* il pannello arriva fino al bordo: la navbar in basso ne copre l'ultima parte */
    .legend { position: fixed; z-index: 1; left: 50%; bottom: calc(var(--peek, 62px) + 10px); transform: translateX(-50%); gap: 10px; padding: 5px 8px; font-size: 11px; }
  }
  .locate { position: fixed; z-index: 6; top: 16px; right: 16px; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--ink); box-shadow: 0 4px 16px rgba(60, 45, 20, .18); cursor: pointer; }
  .locate[hidden] { display: none; }
  @media (max-width: 700px) { .locate { top: calc(env(safe-area-inset-top) + 12px); right: 12px; } }
  .mday { margin: 12px 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .stop, [data-n] { cursor: pointer; }
  ol li[data-n]:hover .t { text-decoration: underline; }
  .modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(30, 22, 10, .45); }
  .modal[hidden] { display: none; }
  .sheet { width: 100%; max-width: 560px; max-height: 88vh; max-height: 88dvh; overflow-y: auto; padding: 16px 16px 28px; background: var(--bg); color: var(--ink); border-radius: 16px 16px 0 0; }
  @media (min-width: 700px) { .modal { align-items: center; } .sheet { border-radius: 16px; } }
  .mhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .sheet h2 { margin: 0; font-size: 20px; }
  .mmeta { color: var(--muted); font-size: 13px; }
  .mclose { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; font-size: 22px; line-height: 1; cursor: pointer; background: var(--line); color: var(--ink); }
  .mphotos { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px 14px; padding: 0 16px 12px; scrollbar-width: thin; }
  .mphotos figure { flex: 0 0 82%; margin: 0; scroll-snap-align: start; }
  .mphotos img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; background: var(--line); }
  .mphotos figcaption { margin-top: 4px; font-size: 11px; line-height: 1.35; color: var(--muted); }
  .mphotos .mcap { color: var(--ink); font-size: 12px; }
  .mphotos a { color: inherit; }
  .mdesc { margin: 0 0 14px; font-size: 15px; }
  .mlabel { margin-bottom: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .mtodo { margin: 0; padding-left: 18px; font-size: 14px; }
  .mtodo li { display: list-item; padding: 3px 0; border: 0; font-size: 14px; cursor: default; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 18px 0; font-size: 12px; line-height: 1.35; border-bottom: 1px solid color-mix(in srgb, var(--line) 45%, transparent); }
  li:last-child { border-bottom: 0; }
  .n { width: 22px; height: 22px; }
  .n svg { display: block; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  .t { font-weight: 600; }
  .meta { color: var(--muted); font-size: 11px; }
  .note { margin-top: 2px; }
  </style>
</head>
<body data-page="mappa">
<div class="zoom"><div class="zstage"><svg id="map" viewBox="-860 -440 7860 9600" role="img" aria-label="Mappa dell'itinerario in Marocco"></svg></div></div>
<h1 class="mtitle">Tappe</h1>
<button class="locate" id="locate" type="button" aria-label="Mostra dove sono"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
<div class="side">
<aside class="panel drag">
  <div class="phead"><div class="grab"></div><h1>Tappe</h1></div>
  <ol id="list" class="plist"></ol>
</aside>
<div class="legend">
  <span><svg viewBox="-15 -15 30 30"><use href="#s-nat" fill="var(--tappa)"/></svg>Natura</span>
  <span><svg viewBox="-15 -15 30 30"><use href="#s-city" fill="var(--tappa)"/></svg>Città / cultura</span>
  <span><svg viewBox="-15 -15 30 30"><use href="#s-coast" fill="var(--tappa)"/></svg>Costa</span>
  <span><svg viewBox="-15 -15 30 30"><use href="#s-transit" fill="var(--tappa)"/></svg>Transito</span>
</div>
</div>

<script src="nav.js"></script>
<script>
// Equirettangolare con longitudine scalata a 32°N: abbastanza per una mappa schematica.
// Zoom sul tragitto: scala 130 px/grado, origine spostata per centrare il giro (le etichette restano a dimensione fissa).
const X = lon => -28 + (lon + 11.2) * 0.85 * 130;
const Y = lat => -170 + (36 - lat) * 130;
const P = ([lat, lon]) => `${X(lon).toFixed(1)},${Y(lat).toFixed(1)}`;

// Contorno semplificato (lat, lon), in senso orario da Capo Spartel.
const outline = [
  [35.79,-5.92],[35.9,-5.35],[35.6,-4.6],[35.25,-3.93],[35.17,-2.93],[35.1,-2.2],
  [34.0,-1.75],[32.8,-1.5],[32.1,-1.2],[31.6,-2.2],[31.1,-3.4],[30.0,-5.3],
  [29.0,-7.0],[28.5,-8.7],[28.5,-11.0],[29.0,-10.5],[29.38,-10.18],[29.7,-9.85],
  [30.65,-9.85],[31.5,-9.8],[32.3,-9.3],[33.25,-8.55],[33.6,-7.7],[34.03,-6.85],[35.2,-6.2]
];

// Contorno grossolano dell'Africa (lat, lon), in senso orario da Capo Spartel. Il tratto marocchino coincide con `outline`.
const africa = [
  [35.79,-5.92],[35.9,-5.35],[35.6,-4.6],[35.25,-3.93],[35.17,-2.93],[35.1,-2.2],
  [35.7,-0.65],[36.1,0.5],[36.5,1.8],[36.77,3.06],[36.9,5.1],[37.0,6.9],[36.9,8.0],[37.25,9.85],[36.8,10.3],[37.05,11.0],
  [35.8,10.8],[34.7,10.8],[33.9,10.1],[33.1,11.5],[32.9,13.2],[32.4,15.1],[31.2,16.6],[30.3,19.0],[31.8,20.0],[32.8,22.0],
  [32.1,23.9],[31.6,25.1],[31.3,27.2],[31.2,29.9],[31.3,31.4],[31.25,32.3],[29.9,32.6],[28.0,33.5],[24.1,35.5],[22.0,36.9],
  [19.6,37.2],[15.6,39.5],[12.6,43.3],[11.6,43.1],[11.8,51.3],[8.0,49.8],[2.0,45.3],[-1.7,41.5],[-4.0,39.7],[-6.8,39.3],
  [-10.3,40.2],[-15.0,40.7],[-19.8,34.9],[-24.0,35.5],[-25.9,32.6],[-29.9,31.0],[-33.0,27.9],[-34.0,25.7],[-34.8,20.0],
  [-33.9,18.4],[-28.6,16.5],[-26.6,15.2],[-22.9,14.5],[-18.0,11.8],[-12.4,13.7],[-8.8,13.2],[-5.9,12.2],[-0.7,8.8],[0.4,9.4],
  [3.8,9.7],[4.3,7.0],[6.4,3.4],[5.6,-0.2],[5.2,-4.0],[4.4,-7.6],[6.3,-10.8],[8.5,-13.2],[10.0,-14.4],[11.9,-15.6],
  [14.7,-17.5],[16.0,-16.5],[18.1,-16.0],[20.9,-17.05],[23.7,-15.95],[27.1,-13.2],[27.9,-12.9],[28.5,-11.0],[29.0,-10.5],
  [29.38,-10.18],[29.7,-9.85],[30.65,-9.85],[31.5,-9.8],[32.3,-9.3],[33.25,-8.55],[33.6,-7.7],[34.03,-6.85],[35.2,-6.2]
];
const madagascar = [[-12.0,49.3],[-16.0,50.4],[-22.0,47.9],[-25.5,45.2],[-24.0,43.7],[-17.0,44.0],[-15.5,46.3]];

const svg = document.getElementById('map');
// Forme delle tappe (centrate, 30 × 30): natura = fiore a 9 petali, città = quadrato, transito = cerchio, costa = goccia.
let out = `<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M0,1 L9,5 L0,9 z" fill="var(--route-line)"/></marker>
  <path id="s-nat" d="M4.51 -12.39A5.2 5.2 0 0 0 -4.51 -12.39A5.2 5.2 0 0 0 -11.42 -6.59A5.2 5.2 0 0 0 -12.98 2.29A5.2 5.2 0 0 0 -8.47 10.10A5.2 5.2 0 0 0 0 13.18A5.2 5.2 0 0 0 8.47 10.10A5.2 5.2 0 0 0 12.98 2.29A5.2 5.2 0 0 0 11.42 -6.59A5.2 5.2 0 0 0 4.51 -12.39Z"/>
  <rect id="s-city" x="-13" y="-13" width="26" height="26"/>
  <circle id="s-transit" r="15"/>
  <path id="s-coast" transform="translate(-15 -15) scale(.01863)" d="M805 0C400 150 40 300 0 800C-10 1290 330 1608 805 1608C1280 1608 1620 1290 1609 800C1570 300 1210 150 805 0Z"/></defs>
  <rect x="-3000" y="-3000" width="7000" height="7000" fill="var(--sea)"/>
  <g fill="var(--land-africa)">${[africa, madagascar].map(a => `<polygon points="${a.map(P).join(' ')}" vector-effect="non-scaling-stroke"/>`).join('')}</g>
  <polygon points="${outline.map(P).join(' ')}" fill="var(--land)"/>
  <g fill="var(--muted)" font-size="13" font-style="italic" opacity=".8">
    <text x="24" y="250">Oceano Atlantico</text>
    <text x="815" y="560" text-anchor="middle">Algeria</text>
  </g>`;

// Grandi città fuori dal giro: solo riferimento per orientarsi, volutamente discrete.
const refCities = [
  { name: 'Tangeri',    ll: [35.78, -5.80], dx: 9,  anchor: 'start' },
  { name: 'Oujda',      ll: [34.68, -1.90], dx: -9, anchor: 'end' },
  { name: 'Rabat',      ll: [34.02, -6.84], dx: -9, anchor: 'end' },
  { name: 'Casablanca', ll: [33.57, -7.59], dx: -9, anchor: 'end' },
  { name: 'Agadir',     ll: [30.43, -9.60], dx: -9, anchor: 'end' }
];
out += `<g fill="var(--muted)" opacity=".7" font-size="12">${refCities.map(c =>
  `<circle cx="${X(c.ll[1])}" cy="${Y(c.ll[0])}" r="3.5"/><text x="${X(c.ll[1]) + c.dx}" y="${Y(c.ll[0]) + 4}" text-anchor="${c.anchor}">${c.name}</text>`).join('')}</g>`;

svg.innerHTML = out + '<g id="rotte"></g><g id="pin"></g>';

// Dove sono: puntino sulla mappa col GPS del telefono; si vede solo se si è in Marocco.
let LIMITI = null; // lat min/max, lon min/max del viaggio (con margine): fuori da qui il puntino non si mostra
const io = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
io.setAttribute('r', 9); io.setAttribute('fill', 'var(--posizione)'); io.setAttribute('stroke', 'var(--bg)'); io.setAttribute('stroke-width', 3);
io.setAttribute('visibility', 'hidden');
svg.append(io);
// Il consenso lo gestisce il telefono e in app dalla Home lo richiede a ogni apertura: si parte da soli solo se è già concesso,
// altrimenti serve il tocco sul bottone (così la richiesta non compare a ogni cambio pagina).
const dove = () => navigator.geolocation.watchPosition(({ coords: { latitude: la, longitude: lo } }) => {
  io.setAttribute('visibility', LIMITI && la > LIMITI[0] && la < LIMITI[1] && lo > LIMITI[2] && lo < LIMITI[3] ? 'visible' : 'hidden');
  io.setAttribute('cx', X(lo)); io.setAttribute('cy', Y(la));
  locate.hidden = true;
}, () => {});
const locate = document.getElementById('locate');
if (!navigator.geolocation) locate.hidden = true;
else {
  locate.onclick = dove;
  navigator.permissions?.query({ name: 'geolocation' }).then(p => { if (p.state === 'granted') dove(); else if (p.state === 'denied') locate.hidden = true; }).catch(() => {});
}
// Mappa sempre a tutto schermo: un dito sposta, due dita zoomano (rotellina su desktop).
// Si disegna tutta l'Africa: pizzicando indietro si vede il contesto; all'avvio si inquadra il tragitto.
const VB = [-860, -440, 7860, 9600];
const W = VB[2], H = VB[3];
const zoom = document.querySelector('.zoom');
const stage = zoom.querySelector('.zstage');
stage.style.width = svg.style.width = W + 'px'; stage.style.height = svg.style.height = H + 'px';
let sc = 1, tx = 0, ty = 0, minSc = 1;
const calcMin = () => Math.min(zoom.clientWidth / W, zoom.clientHeight / H);

const apply = () => {
  const vw = zoom.clientWidth, vh = zoom.clientHeight, w = W * sc, h = H * sc;
  tx = w <= vw ? (vw - w) / 2 : Math.min(0, Math.max(vw - w, tx));
  ty = h <= vh ? (vh - h) / 2 : Math.min(0, Math.max(vh - h, ty));
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
};
const zoomAt = (f, cx, cy) => {
  const n = Math.min(4, Math.max(minSc, sc * f));
  tx = cx - (cx - tx) * (n / sc); ty = cy - (cy - ty) * (n / sc); sc = n; apply();
};

// Pannello tappe: su desktop è un riquadro flottante; su mobile è un bottom sheet con tre posizioni (chiuso, metà, aperto).
const panel = document.querySelector('.panel'), phead = panel.querySelector('.phead');
const mobile = matchMedia('(max-width: 700px)');
const snaps = () => [panel.offsetHeight - phead.offsetHeight - 8 - navbar.offsetHeight, panel.offsetHeight - innerHeight * .42, 0]; // translateY di ogni posizione
let snapI = 1;
const setY = (y, dragging) => { panel.classList.toggle('drag', !!dragging); panel.style.setProperty('--y', y + 'px'); };
const goSnap = (i, subito) => { snapI = i; setY(snaps()[i], subito); document.documentElement.style.setProperty('--peek', panel.offsetHeight - snaps()[0] + 'px'); }; // la legenda sta sopra il pannello chiuso
let drag = null;
phead.addEventListener('pointerdown', e => {
  if (!mobile.matches) return;
  phead.setPointerCapture(e.pointerId);
  drag = { y0: e.clientY, p0: snaps()[snapI], t: e.timeStamp, last: e.clientY, v: 0, moved: false };
});
phead.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.abs(e.clientY - drag.y0) > 6) drag.moved = true;
  drag.v = (e.clientY - drag.last) / Math.max(1, e.timeStamp - drag.t); drag.last = e.clientY; drag.t = e.timeStamp;
  const s = snaps();
  if (drag.moved) setY(Math.min(s[0], Math.max(s[2], drag.p0 + e.clientY - drag.y0)), true);
});
phead.addEventListener('pointerup', e => {
  if (!drag) return;
  const s = snaps(), y = drag.p0 + e.clientY - drag.y0 + drag.v * 150; // proietta con la velocità: un colpo di dito vale più di uno spostamento lento
  goSnap(drag.moved ? s.reduce((b, v, i) => Math.abs(v - y) < Math.abs(s[b] - y) ? i : b, 0) : (snapI === 0 ? 1 : 0));
  drag = null;
});
phead.addEventListener('pointercancel', () => { drag = null; goSnap(snapI); });

// Inquadratura iniziale: il tragitto (ROUTE, misurato sul disegno) centrato nella parte di schermo non coperta dal pannello.
let ROUTE = { cx: 450, cy: 295, w: 800, h: 450 };
const fit = () => {
  minSc = calcMin();
  const m = mobile.matches;
  // spazio libero: su desktop tra la colonna a sinistra e la navbar a destra; su mobile sopra il bottom sheet (la navbar sta in basso)
  const left = m ? 0 : panel.offsetWidth + 32, w = innerWidth - left - (m ? 0 : navbar.offsetWidth);
  const h = m ? innerHeight - (panel.offsetHeight - snaps()[1]) : innerHeight;
  sc = Math.min(1.3, Math.max(minSc, .75, Math.min(w / ROUTE.w, h / ROUTE.h)));
  tx = left + w / 2 - (ROUTE.cx - VB[0]) * sc; ty = h / 2 - (ROUTE.cy - VB[1]) * sc; apply();
};
addEventListener('pagehide', () => { try { sessionStorage.setItem('mappa', JSON.stringify({ tx, ty, sc, i: snapI })); } catch {} });

document.getElementById('list').addEventListener('click', e => { const li = e.target.closest('[data-n]'); if (li) openTappa(+li.dataset.n); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeTappa(); });
addEventListener('resize', () => { minSc = calcMin(); sc = Math.max(sc, minSc); apply(); goSnap(snapI); });

const ptrs = new Map();
let tap = null;
zoom.addEventListener('pointerdown', e => {
  tap = ptrs.size ? null : { x: e.clientX, y: e.clientY, moved: false };
  zoom.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
});
zoom.addEventListener('pointermove', e => {
  const prev = ptrs.get(e.pointerId); if (!prev) return;
  const cur = { x: e.clientX, y: e.clientY };
  if (tap && Math.hypot(cur.x - tap.x, cur.y - tap.y) > 8) tap.moved = true;
  if (mobile.matches && snapI && (ptrs.size > 1 || tap?.moved)) goSnap(0); // navigando la mappa il bottom sheet si abbassa
  if (ptrs.size === 1) { tx += cur.x - prev.x; ty += cur.y - prev.y; apply(); }
  else if (ptrs.size === 2) {
    const o = [...ptrs].find(([id]) => id !== e.pointerId)[1];
    const d0 = Math.hypot(prev.x - o.x, prev.y - o.y), d1 = Math.hypot(cur.x - o.x, cur.y - o.y);
    const mx = (cur.x + o.x) / 2, my = (cur.y + o.y) / 2;
    tx += mx - (prev.x + o.x) / 2; ty += my - (prev.y + o.y) / 2;
    d0 ? zoomAt(d1 / d0, mx, my) : apply();
  }
  ptrs.set(e.pointerId, cur);
});
zoom.addEventListener('pointerup', e => {
  if (tap && !tap.moved && ptrs.size === 1) {
    const g = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-n]');
    if (g) openTappa(+g.dataset.n);
  }
  tap = null; ptrs.delete(e.pointerId);
});
zoom.addEventListener('pointercancel', e => { tap = null; ptrs.delete(e.pointerId); });
zoom.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.002), e.clientX, e.clientY); }, { passive: false });

// Scheda della tappa: foto e descrizione da dati/tappe.md, programma giorno per giorno dal foglio.
const modal = document.createElement('div');
modal.className = 'modal'; modal.hidden = true;
modal.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"></div>';
document.body.append(modal);
const sheet = modal.firstChild;
const closeTappa = () => { modal.hidden = true; };
modal.addEventListener('click', e => { if (e.target === modal) closeTappa(); });

let T = [], C = {}; // tappe dal foglio, contenuti da tappe.md (o, per le tappe nuove, da Wikipedia)
const NOTTI = n => n ? `${n} ${n === 1 ? 'notte' : 'notti'}` : '';
function openTappa(n) {
  const t = T[n - 1], c = C[t.slug];
  sheet.replaceChildren();
  const head = el('div', 'mhead'), titles = el('div');
  titles.append(el('h2', '', t.nome), el('div', 'mmeta', NOTTI(t.notti)));
  const x = el('button', 'mclose', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Chiudi'); x.onclick = closeTappa;
  head.append(titles, x); sheet.append(head);
  modal.hidden = false; sheet.scrollTop = 0;
  const extra = el('div'); sheet.append(extra);
  const riempi = c => {
    if (c?.foto.length) {
      const strip = el('div', 'mphotos');
      for (const f of c.foto) {
        const fig = el('figure'), img = new Image();
        img.src = f.src; img.alt = f.cap; img.loading = 'lazy';
        const cap = el('figcaption'); cap.append(el('span', 'mcap', f.cap), document.createElement('br'));
        if (/^https:/.test(f.url || '')) { const a = el('a', '', f.cred); a.href = f.url; a.target = '_blank'; a.rel = 'noopener'; cap.append(a); }
        else cap.append(f.cred || '');
        fig.append(img, cap); strip.append(fig);
      }
      extra.append(strip);
    }
    if (c?.desc) extra.append(el('p', 'mdesc', c.desc));
  };
  if (c) riempi(c); else automatico(t).then(a => { if (extra.isConnected) riempi(a); });
  const giorni = t.giorni.filter(g => g.cosa);
  if (giorni.length) {
    sheet.append(el('div', 'mlabel', t.giorni.length > 1 ? 'Giorno per giorno' : 'Cosa facciamo'));
    for (const g of giorni) {
      if (t.giorni.length > 1) sheet.append(el('div', 'mday', GIORNO(g.data)));
      const ul = el('ul', 'mtodo'); g.cosa.split('\n').forEach(r => ul.append(el('li', '', r))); sheet.append(ul);
    }
  }
}

// Tratte, segnaposto ed etichette dalle tappe del foglio (coordinate già calcolate dallo script).
function disegna() {
  const pt = t => [X(t.ll[1]), Y(t.ll[0])], uguali = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]) < 6;
  const punti = []; // tappe nello stesso posto (Marrakech all'arrivo, alla visita e al rientro) condividono un segnaposto
  for (const t of T) { const q = pt(t); let p = punti.find(r => uguali(r.q, q)); if (!p) punti.push(p = { q, tappe: [] }); p.tappe.push(t); }
  const occupati = []; // rettangoli già usati da segnaposto, ore e nomi: [x0, y0, x1, y1]
  const urta = r => occupati.some(o => r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1]);
  for (const p of punti) occupati.push([p.q[0] - 17, p.q[1] - 17, p.q[0] + 17, p.q[1] + 17]);
  let rotte = '', ore = '', fatte = new Set();
  T.slice(1).forEach((b, i) => {
    const [x1, y1] = pt(T[i]), [x2, y2] = pt(b);
    if (uguali([x1, y1], [x2, y2])) return;
    const chiave = `${Math.round(x1)},${Math.round(y1)}>${Math.round(x2)},${Math.round(y2)}`, ritorno = fatte.has(`${Math.round(x2)},${Math.round(y2)}>${Math.round(x1)},${Math.round(y1)}`);
    fatte.add(chiave);
    const bend = ritorno ? 44 : 0, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const cx = (x1 + x2) / 2 - dy / len * bend, cy = (y1 + y2) / 2 + dx / len * bend;
    rotte += `<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="var(--route-line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 9" marker-end="url(#a)"/>`;
    const h = ORE(b.guida);
    if (h) { // punto a metà della curva (t = 0,5)
      const mx = (x1 + 2 * cx + x2) / 4, my = (y1 + 2 * cy + y2) / 4 + 4;
      ore += `<text x="${mx}" y="${my}" text-anchor="middle" class="hl" font-size="10" font-weight="600" fill="var(--tag-ink)">${h}</text>`;
      occupati.push([mx - 20, my - 14, mx + 20, my + 6]);
    }
  });
  let pin = '';
  for (const p of punti) {
    const [x, y] = p.q, prima = p.tappe.reduce((m, t) => t.notti > m.notti ? t : m), nome = prima.nome.replace(/\s*\(.*\)/, ''), nts = NOTTI(p.tappe.reduce((n, t) => n + t.notti, 0));
    const larg = Math.max(nome.length * 7.4, nts.length * 5.4);
    // posizione del nome: a destra, a sinistra, sotto, sopra: la prima che non copre altro
    const prove = [['start', 18, -2, [x + 18, y - 14, x + 18 + larg, y + 14]], ['end', -18, -2, [x - 18 - larg, y - 14, x - 18, y + 14]],
      ['middle', 0, 32, [x - larg / 2, y + 19, x + larg / 2, y + 46]], ['middle', 0, -32, [x - larg / 2, y - 44, x + larg / 2, y - 14]]];
    const [anc, dx, dy, r] = prove.find(q => !urta(q[3])) || prove[0];
    occupati.push(r);
    const num = p.tappe.map(t => t.n).join('·');
    pin += `<g class="stop" data-n="${prima.n}"><use href="#s-${p.tappe[0].tipo}" x="${x}" y="${y}" fill="var(--tappa)" stroke="var(--land)" stroke-width="2"/>
      <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${p.tappe.length === 1 ? 12 : p.tappe.length === 2 ? 8.5 : 7}" font-weight="700" fill="var(--tappa-num)">${num}</text>
      <text x="${x + dx}" y="${y + dy}" text-anchor="${anc}" font-size="13" font-weight="600" fill="var(--tappa-nome)" stroke="var(--land)" stroke-width="3" paint-order="stroke">${nome}</text>
      ${nts ? `<text x="${x + dx}" y="${y + dy + 13}" text-anchor="${anc}" font-size="10" fill="var(--muted)" stroke="var(--land)" stroke-width="3" paint-order="stroke">${nts}</text>` : ''}</g>`;
  }
  svg.querySelector('#rotte').innerHTML = rotte + ore; svg.querySelector('#pin').innerHTML = pin;
  // sfondo a pillola dietro ogni valore delle ore, misurato sul testo (dopo il caricamento del font)
  document.fonts.load('600 10px "General Sans"').then(() => svg.querySelectorAll('text.hl').forEach(t => {
    const b = t.getBBox(), r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', b.x - 4); r.setAttribute('y', b.y - 1); r.setAttribute('width', b.width + 8); r.setAttribute('height', b.height + 2);
    r.setAttribute('rx', 6); r.setAttribute('fill', 'var(--tag-bg)'); t.before(r);
  }));
  // area da inquadrare: tutto quello che è stato disegnato, con un po' d'aria
  const b1 = svg.querySelector('#rotte').getBBox(), b2 = svg.querySelector('#pin').getBBox();
  const x0 = Math.min(b1.x, b2.x) - 20, y0 = Math.min(b1.y, b2.y) - 20, x1 = Math.max(b1.x + b1.width, b2.x + b2.width) + 20, y1 = Math.max(b1.y + b1.height, b2.y + b2.height) + 20;
  ROUTE = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
  const la = T.map(t => t.ll[0]), lo = T.map(t => t.ll[1]);
  LIMITI = [Math.min(...la) - 1.5, Math.max(...la) + 1.5, Math.min(...lo) - 1.5, Math.max(...lo) + 1.5];
}

// Avvio: dati del foglio + descrizioni; poi lista, mappa e posizione salvata.
addEventListener('viaggio', () => { // il foglio è cambiato: la mappa riparte (posizione e pannello restano), al massimo una volta al minuto
  try { if (Date.now() - sessionStorage.getItem('ricarica') < 60000) return; sessionStorage.setItem('ricarica', Date.now()); } catch { return; }
  location.reload();
});
Promise.all([viaggio(), contenuti().catch(() => ({}))]).then(([d, c]) => {
  T = tappe(d); C = c;
  document.getElementById('list').innerHTML = T.map(t => `
    <li data-n="${t.n}"><span class="n"><svg viewBox="-16 -16 32 32"><use href="#s-${t.tipo}" fill="var(--tappa)"/><text y="5.5" text-anchor="middle" font-size="16" font-weight="700" fill="var(--tappa-num)">${t.n}</text></svg></span>
    <div><div class="head"><span class="t">${t.nome}</span>
    <span class="meta">${[NOTTI(t.notti), t.guida === '' ? '' : 'guida ' + ORE(t.guida)].filter(Boolean).join(' · ')}</span></div>
    <div class="note">${(c[t.slug]?.desc || '').split(/(?<=\.)\s/)[0]}</div></div></li>`).join('');
  for (const t of T) if (!c[t.slug]) automatico(t).then(a => { const n = document.querySelector(`#list li[data-n="${t.n}"] .note`); if (n && a.desc) n.textContent = a.desc.split(/(?<=\.)\s/)[0]; });
  disegna();
  // Cambiando pagina e tornando, mappa e bottom sheet restano come li hai lasciati (finché l'app/il browser è aperto).
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem('mappa')); } catch {}
  goSnap(saved ? saved.i : 1, true); fit(); // subito: senza animazione al primo disegno
  if (saved) { ({ tx, ty } = saved); sc = Math.max(minSc, saved.sc); apply(); }
  setTimeout(() => panel.classList.remove('drag'), 50);
}).catch(() => document.getElementById('list').innerHTML = '<li><div>Dati non disponibili.</div></li>');
</script>
</body>
